<%inherit file="base.html"/>
<%def name="title()">Добавить стих</%def>

<h1>Добавление стиха</h1>

% if error:
    <div class="error">${error}</div>
% endif

<form action="/add_poem_page" method="POST">
    <div class="form-group">
        <label for="title">Название</label>
        <input type="text" id="title" name="title" required>
    </div>
    <div class="form-group">
        <label for="content">Текст стиха</label>
        <textarea id="content" name="content" style="min-height: 300px; font-style: italic;" required></textarea>
    </div>
    <button type="submit" class="btn">Добавить</button>
</form>

<hr class="divider">
<a href="/poems_page" class="btn btn-muted">Назад</a>
