<%inherit file="base.html"/>
<%def name="title()">Мои статьи</%def>

<h1>Мои статьи</h1>

% if articles:
    <table class="data-table">
        <thead>
            <tr>
                <th>Название</th>
                <th>Предмет</th>
                <th>Дата</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            % for article in articles:
                <tr>
                    <td>${article.title}</td>
                    <td>${article.classmates or '—'}</td>
                    <td>${article.created_at}</td>
                    <td>
                        <div class="flex">
                            <a href="/article/${article.title}" class="btn btn-muted">Читать</a>
                            <form action="/article/${article.title}/delete" method="POST" class="inline-form">
                                <button type="submit" class="btn btn-danger">Удалить</button>
                            </form>
                        </div>
                    </td>
                </tr>
            % endfor
        </tbody>
    </table>
% else:
    <p class="muted">У вас пока нет статей</p>
    <a href="/add_article_page" class="btn">Добавить статью</a>
% endif
