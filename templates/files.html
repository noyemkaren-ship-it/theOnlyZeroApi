<%inherit file="base.html"/>
<%def name="title()">Файлы</%def>

<h1>Файлы</h1>

<div class="flex" style="margin-bottom: 30px;">
    <a href="/upload_file_page" class="btn">Загрузить файл</a>
</div>

% if files:
    <table class="data-table">
        <thead>
            <tr>
                <th>Имя файла</th>
                <th>Размер</th>
                <th>Дата</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            % for file in files:
                <tr>
                    <td class="mono">${file['filename']}</td>
                    <td>${file['size']} bytes</td>
                    <td>${file['created_at']}</td>
                    <td>
                        <div class="flex">
                            <a href="/files/${file['filename']}/download" class="btn btn-muted">Скачать</a>
                            <form action="/files_page/${file['filename']}/delete" method="POST" class="inline-form">
                                <button type="submit" class="btn btn-danger">Удалить</button>
                            </form>
                        </div>
                    </td>
                </tr>
            % endfor
        </tbody>
    </table>
% else:
    <p class="muted">Файлы не найдены</p>
% endif
