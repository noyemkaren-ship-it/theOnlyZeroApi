<%inherit file="base.html"/>
<%def name="title()">Написать сообщение</%def>

<h1>Написать сообщение</h1>

% if error:
    <div class="error">${error}</div>
% endif

% if success:
    <div class="success">${success}</div>
% endif

<form action="/send_message_page" method="POST">
    <div class="form-group">
        <label for="getter_name">Кому (имя пользователя)</label>
        <input type="text" id="getter_name" name="getter_name" value="${to or ''}" required>
    </div>
    <div class="form-group">
        <label for="content">Сообщение</label>
        <textarea id="content" name="content" style="min-height: 200px;" required></textarea>
    </div>
    <button type="submit" class="btn">Отправить</button>
</form>

<hr class="divider">
<a href="/messages_page" class="btn btn-muted">Назад</a>
