<%inherit file="base.html"/>
<%def name="title()">Пользователи</%def>

<h1>Управление</h1>

<table class="data-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Email</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        % for user in users:
            <tr>
                <td class="mono">${user.id}</td>
                <td>${user.name}</td>
                <td>${user.email}</td>
                <td>
                    <span class="status-badge ${'status-banned' if user.banned else 'status-active'}">
                        ${'Banned' if user.banned else 'Active'}
                    </span>
                </td>
                <td>
                    <div class="flex">
                        <a href="/user/${user.id}/edit_page" class="btn btn-muted">Edit</a>
                        <form action="/user/${user.id}/delete" method="POST" class="inline-form">
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
        % endfor
    </tbody>
</table>
