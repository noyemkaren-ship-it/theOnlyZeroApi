<%inherit file="base.html"/>
<%def name="title()">AI Консультант</%def>

<style>
    .chat-container {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 20px;
        box-shadow: var(--shadow);
    }
    
    .chat-header {
        background: var(--bg-tertiary);
        padding: 20px;
        border-bottom: 1px solid var(--border);
    }
    
    .chat-header h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
    }
    
    .chat-header p {
        margin: 5px 0 0;
        color: var(--text-muted);
        font-size: 14px;
    }
    
    .chat-messages {
        height: 400px;
        overflow-y: auto;
        padding: 20px;
        background: var(--bg-primary);
    }
    
    .message {
        margin-bottom: 15px;
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 8px;
        animation: fadeIn 0.3s;
        line-height: 1.5;
    }
    
    .message.user {
        margin-left: auto;
        background: var(--accent);
        color: white;
        border-radius: 8px 8px 0 8px;
    }
    
    .message.bot {
        margin-right: auto;
        background: var(--bg-tertiary);
        color: var(--text-primary);
        border-radius: 8px 8px 8px 0;
    }
    
    .chat-input {
        padding: 20px;
        border-top: 1px solid var(--border);
        background: var(--bg-secondary);
    }
    
    .input-group {
        display: flex;
        gap: 10px;
    }
    
    .input-group input {
        flex: 1;
        padding: 12px;
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 16px;
        transition: all 0.2s;
    }
    
    .input-group input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(77, 171, 247, 0.1);
    }
    
    .input-group button {
        padding: 12px 24px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-family: inherit;
        font-size: 16px;
        font-weight: 500;
        transition: all 0.2s;
    }
    
    .input-group button:hover {
        opacity: 0.9;
        box-shadow: var(--shadow-hover);
    }
    
    .input-group button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    
    .typing-indicator {
        display: none;
        padding: 12px 16px;
        margin-bottom: 15px;
        max-width: 70%;
    }
    
    .typing-indicator.active {
        display: block;
    }
    
    .typing-dots {
        display: flex;
        gap: 5px;
    }
    
    .typing-dot {
        width: 8px;
        height: 8px;
        background: var(--text-muted);
        border-radius: 50%;
        animation: bounce 1.4s infinite;
    }
    
    .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
    }
    
    .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
    }
    
    @keyframes fadeIn {
        from { 
            opacity: 0; 
            transform: translateY(10px); 
        }
        to { 
            opacity: 1; 
            transform: translateY(0); 
        }
    }
    
    @keyframes bounce {
        0%, 60%, 100% {
            transform: translateY(0);
        }
        30% {
            transform: translateY(-10px);
        }
    }
</style>

<h1>AI Консультант</h1>

<div class="chat-container">
    <div class="chat-header">
        <h1 style="font-size: 20px;">Виртуальный помощник</h1>
        <p>Задайте вопрос о платформе, книгах или исследованиях</p>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            Здравствуйте! Я виртуальный консультант TheOnlyZeroAPI. 
            Я могу помочь вам с навигацией по платформе, поиском книг и статей.
        </div>
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
    </div>
    
    <div class="chat-input">
        <form id="chatForm" class="input-group">
            <input type="text" id="messageInput" placeholder="Введите ваше сообщение..." autocomplete="off">
            <button type="submit" id="sendButton">Отправить</button>
        </form>
    </div>
</div>

<script>
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const chatMessages = document.getElementById('chatMessages');
    const typingIndicator = document.getElementById('typingIndicator');
    const sendButton = document.getElementById('sendButton');
    
    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = messageInput.value.trim();
        if (!message) return;
        
        addMessage(message, 'user');
        messageInput.value = '';
        typingIndicator.classList.add('active');
        sendButton.disabled = true;
        
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });
            const data = await response.json();
            typingIndicator.classList.remove('active');
            addMessage(data.response, 'bot');
        } catch (error) {
            typingIndicator.classList.remove('active');
            addMessage('Произошла ошибка. Попробуйте еще раз.', 'bot');
        } finally {
            sendButton.disabled = false;
            messageInput.focus();
        }
    });
    
    function addMessage(text, role) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message ' + role;
        messageDiv.textContent = text;
        chatMessages.insertBefore(messageDiv, typingIndicator);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>
