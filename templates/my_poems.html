<%inherit file="base.html"/>
<%def name="title()">Мои стихи</%def>

<h1>Мои стихи</h1>

% if poems:
    <table class="data-table">
        <thead>
            <tr>
                <th>Название</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            % for poem in poems:
                <tr>
                    <td>${poem.title}</td>
                    <td>
                        <div class="flex">
                            <a href="/poem/${poem.id}" class="btn btn-muted">Читать</a>
                            <form action="/poem/${poem.id}/delete" method="POST" class="inline-form">
                                <button type="submit" class="btn btn-danger">Удалить</button>
                            </form>
                        </div>
                    </td>
                </tr>
            % endfor
        </tbody>
    </table>
% else:
    <p class="muted">У вас пока нет стихов</p>
    <a href="/add_poem_page" class="btn">Добавить стих</a>
% endif
