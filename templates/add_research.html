<%inherit file="base.html"/>
<%def name="title()">Добавить исследование</%def>

<h1>Добавление исследования</h1>

% if error:
    <div class="error">${error}</div>
% endif

<form action="/add_research_page" method="POST" enctype="multipart/form-data">
    <div class="form-group">
        <label for="title">Название</label>
        <input type="text" id="title" name="title" required>
    </div>
    <div class="form-group">
        <label for="description">Описание</label>
        <textarea id="description" name="description"></textarea>
    </div>
    <div class="form-group">
        <label for="file">Документ</label>
        <input type="file" id="file" name="file" required>
    </div>
    <button type="submit" class="btn">Добавить</button>
</form>

<hr class="divider">
<a href="/research_page" class="btn btn-muted">Назад</a>
